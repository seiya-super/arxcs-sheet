<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arxcs 個人シート</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111215">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arxcs">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111215;--sub:#6b7079;--line:#e4e5e8;--card:#fff;--bg:#f5f5f2;--accent:#111215;--accent-ink:#fff;
  --danger:#d93025;--warn:#c77700;--brand:#2f5bea;--locked:#eef0f3;--ok:#16a34a;
  --s-interview1:#3b82f6;--s-interview2:#2563eb;--s-interview3:#1d4ed8;--s-a2:#8b5cf6;--s-dml:#a855f7;
  --s-proposal:#ec4899;--s-proposalDate:#f97316;--s-participationDate:#eab308;--s-enrolled:#16a34a;--s-declined:#9ca3af;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
input,select,textarea{font:inherit;color:inherit}
.brand-font{font-family:"Plus Jakarta Sans","Noto Sans JP",sans-serif}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0c0e;padding:20px}
.login-card{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo-title{font-weight:800;font-size:16px;line-height:1.1}
.logo-sub{font-size:10px;color:var(--sub);font-weight:700}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:5px}
.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
.inp:focus{outline:2px solid var(--ink);outline-offset:-1px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.sm{padding:4px 10px;font-size:11px}
.note{font-size:11px;color:var(--sub);line-height:1.6}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px;background:rgba(245,245,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-brand{display:flex;align-items:center;gap:8px}
.app-title{font-weight:800;font-size:14px}
.app-title span{font-weight:500;color:var(--sub)}
.topbar-user{display:flex;align-items:center;gap:8px}
.member-pill{background:var(--locked);font-weight:900;font-size:12px;padding:6px 12px;border-radius:999px}
.nav-menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:16px}
.tab-nav{display:flex;gap:4px;padding:10px 20px 0;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--bg)}
.tab-link{border:none;background:none;padding:9px 14px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-link.active{color:var(--ink);border-bottom-color:var(--ink)}
.tab-link:hover{color:var(--ink)}
.app-content{padding:18px 20px 80px;max-width:1600px;margin:0 auto}
.banner{font-size:12px;padding:8px 12px;border-radius:10px;margin-bottom:12px;background:#fff7e6;border:1px solid #f5d39b;color:#7a4b00}
.banner.err{background:#fdecea;border-color:#f3b4ae;color:#8a1c12}
.watermark{position:fixed;right:18px;bottom:10px;font-family:"Plus Jakarta Sans";font-weight:800;font-size:44px;color:rgba(0,0,0,.035);pointer-events:none;z-index:0}
@media (max-width:760px){
  .nav-menu-btn{display:block}
  .tab-nav{display:none;flex-direction:column;padding:6px 12px}
  .tab-nav.open{display:flex}
  .tab-link{text-align:left;border-bottom:none;border-left:3px solid transparent}
  .tab-link.active{border-left-color:var(--ink)}
  .topbar{padding:10px 12px}.app-content{padding:14px 10px 80px}
  .app-title span{display:none}
}

/* ---------- tables ---------- */
.scrollx{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 230px)}
table.t{border-collapse:separate;border-spacing:0;width:100%}
table.t th{position:sticky;top:0;background:#fafafa;z-index:1;text-align:left;font-size:11px;color:var(--sub);font-weight:700;padding:7px 8px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.t td{padding:4px 5px;border-bottom:1px solid #f0f0f2;font-size:12px;vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
.cell{width:100%;min-width:80px;padding:6px 8px;font-size:12px;border:1px solid var(--line);border-radius:6px;background:#fff}
.cell:focus{outline:2px solid var(--ink);outline-offset:-1px}
.cell[type=date]{min-width:128px}
.cell.w-name{min-width:110px}.cell.w-uni{min-width:150px}.cell.w-s{min-width:84px}.cell.w-memo{min-width:150px}
.num{color:var(--sub);font-size:11px;text-align:center}
.empty-row td{padding:28px;text-align:center;color:var(--sub);font-size:12px}
.dup-row td{background:#fff5f4}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--locked);white-space:nowrap}
.badge.dup{background:#fde2df;color:var(--danger);white-space:normal;min-width:90px;line-height:1.4;border-radius:8px}
.badge.dup.self{background:#fff1d6;color:var(--warn)}

/* toolbars */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.toolbar .grow{flex:1}
.filter{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.filter select,.filter input{border:none;background:transparent;font-size:12px;font-weight:700;padding:3px 4px;max-width:180px;color:var(--ink)}
.filter select:focus,.filter input:focus{outline:none}
.search{flex:1;min-width:220px;max-width:520px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px}
.count{font-size:11px;color:var(--sub);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:#fff;padding:2px}
.seg button{border:none;background:none;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--sub)}
.seg button.active{background:var(--ink);color:#fff}
.sortbar{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--sub);font-weight:700}
.sortbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--sub)}
.sortbar button.active{border-color:var(--ink);color:var(--ink)}
.alert-strip{font-size:12px;background:#fff5f4;border:1px solid #f6c8c3;color:var(--danger);border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.alert-strip button{border:none;background:#fde2df;color:var(--danger);font-weight:700;font-size:11px;border-radius:999px;padding:2px 9px}

.add-row-btn{width:100%;border:1px dashed var(--line);background:#fafafa;border-radius:8px;padding:9px;font-size:12px;font-weight:700;color:var(--sub)}
.add-row-btn:hover{color:var(--ink);border-color:var(--ink)}
.draft-row td{background:#f7f8ff}
tr.new-row td,.iaa-t tr.new-row td.stk0,.iaa-t tr.new-row td.stk1{background:#f2f6ff}
.lcard.new-row{border-color:#9db7ff;background:#f7f9ff}
.fab{position:fixed;right:22px;bottom:22px;z-index:25;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:12px 18px;font-weight:700;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.dup-msg{display:block;font-size:11px;margin-top:4px;line-height:1.5}
.dup-msg.ng{color:var(--danger);font-weight:700}
.dup-msg.ok{color:var(--ok)}
.dup-who{display:block;font-size:11px;color:var(--sub);line-height:1.6;white-space:normal}
.dup-who b{color:var(--danger)}
.import-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:640px}
.progress{height:10px;background:#eceef2;border-radius:999px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:var(--brand);width:0}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.lcard.dup{border-color:#f3b4ae}
.lcard-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.lcard-name{font-weight:900;font-size:15px}
.lcard-furi{font-size:11px;color:var(--sub)}
.lcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.cf{display:block}.cf>span{display:block;font-size:10px;font-weight:700;color:var(--sub);margin-bottom:3px}
.cf .cell{min-width:0}
.stage-badge{font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--locked)}
.stage-interview{background:#dbeafe;color:#1d4ed8}.stage-event{background:#fef3c7;color:#92400e}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 14px;font-size:16px;font-weight:900}
.modal .fields{display:grid;gap:10px}

/* status */
.pill{display:inline-block;font-size:10px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--locked);color:var(--ink)}
.pill.s-面談1回目{background:#dbeafe;color:#1e40af}.pill.s-面談2回目{background:#c7dbfe;color:#1e3a8a}.pill.s-面談3回目{background:#b4ccfc;color:#1e3a8a}
.pill.s-①A2基準達成{background:#ede9fe;color:#5b21b6}.pill.s-②DML動画配布{background:#f3e8ff;color:#7e22ce}
.pill.s-③提案{background:#fce7f3;color:#9d174d}.pill.s-④提案日{background:#ffedd5;color:#9a3412}.pill.s-⑤参加{background:#fef9c3;color:#854d0e}
.pill.s-⑥入会{background:#dcfce7;color:#166534}.pill.s-⑦見送り{background:#f3f4f6;color:#6b7280}.pill.s-イベント{background:#fef3c7;color:#92400e}
.profile .n{font-weight:900;font-size:13px}.profile .f{font-size:10px;color:var(--sub)}
.profile .m{font-size:10px;color:var(--sub);margin-top:2px}
.step-cell{position:relative}
.step-cell.filled::before{content:"";position:absolute;left:2px;right:2px;bottom:2px;height:3px;border-radius:2px;background:var(--c)}
.step-th{border-bottom:3px solid var(--c)!important}
.stack{display:grid;gap:4px}.stack label{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:4px;font-size:10px;color:var(--sub);font-weight:700;white-space:nowrap}
.declined-cell .cell{background:#f3f4f6}
tr.row-⑥入会 td{background:#f4fbf6}tr.row-⑦見送り td{background:#f8f8f8;color:#8a8f98}

/* IAA：コンパクトな行・名前は横1行で左に固定 */
.iaa-t td{padding:3px 4px}
.iaa-t .cell{padding:4px 6px;font-size:12px;height:28px}
.iaa-t .cell[type=date]{min-width:118px;width:118px}
.iaa-t .cell.w-memo{min-width:140px}
.iaa-t .cell.w-s{min-width:96px}
.iaa-t .stk0{position:sticky;left:0;z-index:2;background:#fff;width:34px;min-width:34px;max-width:34px}
.iaa-t .stk1{position:sticky;left:34px;z-index:2;background:#fff;box-shadow:1px 0 0 var(--line)}
.iaa-t th.stk0,.iaa-t th.stk1{z-index:3;background:#fafafa}
.iaa-t tr.dup-row td.stk0,.iaa-t tr.dup-row td.stk1{background:#fff5f4}
.iaa-t tr.draft-row td.stk0,.iaa-t tr.draft-row td.stk1{background:#f7f8ff}
.pline{min-width:150px;max-width:230px}
.pl1{white-space:nowrap;display:flex;align-items:baseline;gap:6px}
.pn{font-weight:900;font-size:13px}
.pf{font-size:10px;color:var(--sub)}
.pm{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.prog{display:flex;align-items:center;gap:6px;white-space:nowrap}
@media (max-width:760px){ .pline{min-width:110px;max-width:130px} .pl1{flex-direction:column;align-items:flex-start;gap:0} .pf{display:none} }
.pd{font-size:10px;color:var(--sub)}
.iaa-t .na-box{padding:3px 6px}
.iaa-t .na-input{padding:3px 6px}
.iaa-t .na-history{margin-top:3px;flex-wrap:nowrap;white-space:nowrap}
.iaa-t .na-wrap{flex-wrap:nowrap;white-space:nowrap}
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
/* リンク列・日程調整 */
.lk{display:flex;align-items:center;gap:4px}
.cell.w-link{min-width:130px;width:150px}
.lk-go{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:var(--ink);color:#fff;text-decoration:none;font-size:12px;font-weight:900;flex:none}
.lk-go.off{background:#eceef2;color:#b0b4bb}
.sched-chip{border:1px dashed var(--line);background:#fff;border-radius:999px;padding:3px 9px;font-size:10px;font-weight:700;color:var(--sub);white-space:nowrap}
.sched-chip.on{border:1px solid #f5c26b;background:#fff4dc;color:#8a5a00}
.tab-count{display:inline-block;margin-left:5px;min-width:18px;padding:0 5px;border-radius:999px;background:#f5a623;color:#fff;font-size:10px;line-height:18px;text-align:center}
.sched-summary{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;font-size:13px}
.late{color:var(--danger);font-weight:700}.warn-t{color:var(--warn);font-weight:700}
/* step input */
.na-wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.na-box{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--c,#ddd);border-radius:12px;padding:5px 8px;background:#fff}
.na-box.optional{border-style:dashed}
.na-label{font-size:9px;font-weight:900;color:#fff;background:var(--c,#999);border-radius:4px;padding:1px 5px;letter-spacing:.05em}
.na-step{font-weight:900;font-size:12px}
.na-input{padding:4px 6px;font-size:12px;border:1px solid var(--line);border-radius:6px;max-width:150px}
.na-confirm{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:700}
.na-back,.na-add{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;color:var(--sub)}
.na-done{color:var(--ok);font-weight:900;font-size:12px}
.na-history{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}
.na-chip{font-size:10px;border-radius:999px;padding:2px 8px;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 70%,#000)}
.na-chip b{margin-right:4px}
.na-arrow{color:var(--sub);font-size:10px}

/* apo */
.apo-stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--apo-bg,#fff)}
.apo-stepper button{width:22px;height:22px;border-radius:50%;border:none;background:rgba(255,255,255,.8);font-weight:900;font-size:13px;line-height:1}
.apo-stepper span{min-width:18px;text-align:center;font-weight:900;font-size:12px}
.apo-table td{text-align:center}

/* event */
.addform{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.addform b{font-size:12px}
.addform select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:12px;background:#fff;max-width:280px}
.event-more td{border-top:none}

/* overview */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--sub);display:inline-flex;gap:6px}
.chip b{color:var(--ink)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}.chip.active b{color:#fff}
tr.clickable{cursor:pointer}tr.clickable:hover td{background:#f7f7f9}

/* dashboard */
.dash-period{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.dash-top{display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,1.6fr) minmax(240px,1fr);gap:12px;margin-bottom:12px}
.dash-bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
@media (max-width:1100px){.dash-top,.dash-bottom{grid-template-columns:1fr}}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.dcard h3{margin:0 0 12px;font-size:13px;font-weight:900}
.dsub{font-size:11px;color:var(--sub);font-weight:700;margin:14px 0 6px}
.dsub.first{margin-top:0}
.goal-wrap{display:flex;align-items:center;gap:14px}
.ring{--pct:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--pct)*1%),#eceef2 0);display:grid;place-items:center;flex:none}
.ring span{width:72px;height:72px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
.ring small,.dash small{font-size:.6em;margin-left:1px}
.mini-list{display:grid;gap:4px}
.mini-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 8px;border-radius:8px;background:#fafafa}
.mini-row.current{background:#eef2ff}
.mini-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c,#999);margin-right:6px}
.funnel-row{display:grid;grid-template-columns:90px 1fr 32px;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.funnel-track{height:14px;background:#f1f2f4;border-radius:999px;overflow:hidden}
.funnel-bar{height:100%;background:var(--brand);border-radius:999px}
.funnel-num{text-align:right;font-weight:900}
.conv-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.conv-item{text-align:center;padding:6px 8px;background:#fafafa;border-radius:10px;min-width:62px}
.conv-pct{font-weight:900;font-size:16px}.conv-label{font-size:10px;color:var(--sub);font-weight:700}.conv-n{font-size:10px;color:var(--sub)}
.conv-arrow{color:var(--sub)}
.stg-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stg-item{background:#fafafa;border-radius:10px;padding:8px;font-size:10px;color:var(--sub);font-weight:700;display:flex;flex-direction:column;gap:2px}
.stg-item b{font-size:16px;color:var(--ink)}.stg-item.warn b{color:var(--danger)}
.lt{width:100%;border-collapse:collapse;font-size:11px}
.lt th{text-align:left;color:var(--sub);font-weight:700;padding:4px;border-bottom:1px solid var(--line)}
.lt td{padding:4px;border-bottom:1px solid #f3f3f5}.lt td.l{color:var(--sub)}.lt td.main{font-weight:900}.lt td.none{color:#b0b4bb}
.na-list{display:grid;gap:4px;max-height:420px;overflow:auto}
.na-row{display:grid;grid-template-columns:76px minmax(80px,1fr) auto minmax(0,1fr) 14px;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:#fafafa;font-size:12px;cursor:pointer}
.na-row:hover{background:#f0f1f4}
.na-when{font-size:11px;font-weight:700;color:var(--sub)}.na-when.today{color:var(--brand)}.na-when.late{color:var(--danger)}
.na-name{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.na-meta{font-size:10px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{color:var(--sub)}
.dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.dstat{background:#fafafa;border-radius:10px;padding:8px}.dstat .l{font-size:10px;color:var(--sub);font-weight:700}.dstat .v{font-size:20px;font-weight:900}
.alist{display:grid;gap:4px;max-height:360px;overflow:auto}
.arow{display:grid;grid-template-columns:minmax(70px,auto) 1fr 14px;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;background:#fafafa;font-size:12px;cursor:pointer}
.arow.warn{background:#fff8eb}.arow.dup{background:#fff1f0}
.arow .n{font-weight:900}.arow .r{font-size:11px;color:var(--sub)}
.arow.warn .r{color:var(--warn)}.arow.dup .r{color:var(--danger)}
.dempty{font-size:12px;color:var(--sub);padding:14px;text-align:center}

/* admin */
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.admin-sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
textarea.inp{min-height:180px;font-size:12px;line-height:1.6}
.mrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:10px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div id="app"><div class="loading">読み込み中…</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc as fdoc, collection as fcol, setDoc, updateDoc, deleteDoc, addDoc, getDoc, getDocsFromCache, onSnapshot as fsnap, query, where, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./config.js";
/* ================== マスタ（初期値） ================== */
const REGION_OPTIONS = ["北海道","東北","関東","中部","近畿","中国","四国","九州・沖縄","海外","未設定"];
const DEFAULT_MASTERS = {
  universities: [],
  clubs: ["サッカー","野球","テニス","バスケ","バレー","ラグビー","バドミントン","アメリカンフットボール","卓球","陸上","柔道","水泳","ダンス","チアリーディング","ラクロス","ホッケー","スキー","レスリング","フェンシング","ソフトボール","ソサイチ","マーチングバンド","ボディビル","パルクール","空道","アメフト","駅伝","弓道","シンクロ","フットサル","ハンド"],
  gradYears: ["22年卒","23年卒","24年卒","25年卒","26年卒","27年卒","28年卒","29年卒","30年卒","31年卒"],
  routes: ["SNS（インスタ＆TikTok）","イベント","紹介","その他","実行委員会","リーダーズアカデミー","マガジン","講演会","取材アワード"],
  events: [],
  proposals: ["Arxcs","Arxcs→モノポリー","イベント","紹介"],
  alert: { default: 10, contact: 10, byStatus: {} }
};
const ALERT_STATUSES = ["面談1回目","面談2回目","面談3回目","①A2基準達成","②DML動画配布","③提案","④提案日","⑤参加"];
const YEAR_OPTIONS = [2024,2025,2026,2027,2028,2029,2030];
const APO_MAX = 15;
// 個人シートにログインしたまま「管理」も使える担当者（管理画面の「メンバー」で変更できる。最初の値）
const DEFAULT_ADMIN_MEMBERS = ["shiromizu","matsuoka"];
const TABS = [
  {id:"dash",label:"ダッシュボード"},{id:"apo",label:"アポ目標"},{id:"lead",label:"見込み顧客"},{id:"sched",label:"日程調整"},
  {id:"mtg",label:"IAA"},{id:"event",label:"イベント"},{id:"overview",label:"担当リスト"},{id:"all",label:"全体リスト"},{id:"admin",label:"管理",admin:true}
];
const STEPS = [
  {field:"interview1",label:"面談1回目"},{field:"interview2",label:"面談2回目"},{field:"interview3",label:"面談3回目"},
  {field:"a2",label:"①A2基準達成"},{field:"dml",label:"②DML動画配布"},{field:"proposal",label:"③提案",text:true},
  {field:"proposalDate",label:"④提案日"},{field:"participationDate",label:"⑤参加日"},{field:"enrolled",label:"⑥入会"}
];
const STEP_BY = Object.fromEntries(STEPS.map(s=>[s.field,s]));
const MAIN_FLOW = ["interview1","a2","dml","proposal","proposalDate","participationDate","enrolled"];
const PROGRESS_OPTIONS = ["見込み","イベント","面談1回目","面談2回目","面談3回目","①A2基準達成","②DML動画配布","③提案","④提案日","⑤参加","⑥入会","⑦見送り"];

/* ================== 状態 ================== */
const LS = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}} };
const S = {
  db:null, user:null, canWrite:true, isAdmin:false, dbState:"loading", stale:false,
  members:null, candidates:[], apoAll:{}, masters:null,
  me:null, uid:null, account:undefined, actingAs:null, inviteCode:null, invite:undefined, regBusy:false, accounts:[], invites:[], newInviteLink:null,
  tab: LS.get("arxcs_tab") || "dash", navOpen:false,
  draft:null, draftMode:null, busy:false, pendingDelete:null,
  leadQuery:"", leadFilter:{}, leadSort:{}, leadView: window.innerWidth < 900 ? "card" : "list",
  iaaSort:{}, iaaMode: LS.get("arxcs_iaa_mode")==="step" ? "step" : "list",
  naStep:{}, naDraft:{}, eventFilter:"",
  ovFilter: freshOv(), ovLimit:200, dashPeriod:{ym:"",week:0},
  apoYear: new Date().getFullYear(),
  adminSection:"dash", adminDashWho:"", adminOvFilter: freshOv(),
  toast:null, deferRender:false
};
function freshOv(){ return {grade:"",route:"",region:"",university:"",progress:"",member:"",q:""}; }
function M(){ return S.masters || DEFAULT_MASTERS; }
function activeMembers(){ return (S.members||[]).filter(m=>m.active!==false); }
function memberName(id){ if(id==="__admin__") return "管理者"; if(memberCache.src!==S.members){ memberCache={src:S.members,map:new Map((S.members||[]).map(m=>[m.id,m.name]))}; } return memberCache.map.get(id)||""; }

/* ================== ユーティリティ ================== */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const todayStr = () => ymd(new Date());
const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v||"");
const slash = v => isDate(v) ? v.replace(/-/g,"/") : (v||"");
const md = v => isDate(v) ? Number(v.slice(5,7))+"/"+Number(v.slice(8,10)) : (v||"");
function diffDays(a,b){ if(!isDate(a)||!isDate(b)) return null; return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
const fullName = c => [c&&c.lastName||"", c&&c.firstName||""].filter(Boolean).join(" ");
const fullFuri = c => [c&&c.lastNameFurigana||"", c&&c.firstNameFurigana||""].filter(Boolean).join(" ");
const nameOf = c => fullName(c) || c.accountName || "";
const nameKey = c => fullName(c).normalize("NFKC").replace(/[\s　]+/g,"").toLowerCase();
const normHandle = s => (s||"").trim().replace(/^[@＠]+/,"").toLowerCase();
function splitName(v){ const t=String(v||"").trim().replace(/　/g," ").replace(/\s+/g," "); if(!t) return ["",""]; const i=t.indexOf(" "); return i<0?[t,""]:[t.slice(0,i),t.slice(i+1)]; }
let regionCache={m:null,map:null};
function regionOf(u){ if(!u) return ""; const m=M(); if(regionCache.m!==m){ regionCache={m,map:new Map(m.universities.map(o=>[o.name,o.region||"未設定"]))}; } return regionCache.map.get(u)||"未設定"; }
let memberCache={src:null,map:null};
function uniNames(){ return M().universities.map(u=>u.name); }
function alertDaysFor(st){ const a=M().alert||{}; return (a.byStatus&&a.byStatus[st]) || a.default || 10; }
function alertContact(){ return (M().alert||{}).contact || 10; }
function registeredDate(c){ return isDate(c.contactedAt) ? c.contactedAt : (c.createdAt||"").slice(0,10); }

function computeStatus(c){
  if(c.declined) return "⑦見送り"; if(c.enrolled) return "⑥入会"; if(c.participationDate) return "⑤参加";
  if(c.proposalDate) return "④提案日"; if(c.proposal) return "③提案"; if(c.dml) return "②DML動画配布";
  if(c.a2) return "①A2基準達成"; if(c.interview3) return "面談3回目"; if(c.interview2) return "面談2回目";
  if(c.interview1) return "面談1回目"; return "";
}
const PROGRESS_DATE_FIELDS = ["interview1","interview2","interview3","a2","dml","proposalDate","participationDate","enrolled","declined"];
function latestActionDate(c){ let l=""; PROGRESS_DATE_FIELDS.forEach(f=>{ if(c[f] && c[f]>l) l=c[f]; }); return l; }
function computeStage(c){ if(c.proposal==="イベント") return "event"; if(c.interview1) return "interview"; if(c.initialActionDate) return "event"; return ["interview","event"].includes(c.legacySourceStage) ? c.legacySourceStage : "lead"; }
const isIaa = c => !!c.interview1;
const eventEntriesOf = c => Array.isArray(c.eventEntries) ? c.eventEntries : (c.eventName ? [c.eventName] : []);
const isEventC = c => !!c.initialActionDate || c.proposal==="イベント" || eventEntriesOf(c).length>0;
const progressOf = c => computeStatus(c) || (computeStage(c)==="event" ? "イベント" : "見込み");
const mine = () => S.candidates.filter(c=>c.ownerUid===S.me);

// 重複の判定：姓名がどちらも入っていて同じ人、または同じSNSアカウントの人
function dupKeys(c){ const k=[]; if(c.lastName && c.firstName){ const n=nameKey(c); if(n) k.push("n:"+n); } const h=normHandle(c.accountName); if(h) k.push("h:"+h); return k; }
let dupCache={src:null,info:null};
function dupInfo(list){
  if(dupCache.src===list) return dupCache.info;
  const by={}; list.forEach(c=>dupKeys(c).forEach(k=>(by[k]=by[k]||[]).push(c)));
  const info={};
  Object.values(by).forEach(g=>{ if(g.length<2) return; g.forEach(c=>{ const i=info[c.id]||(info[c.id]={others:[]}); g.forEach(o=>{ if(o.id!==c.id && !i.others.includes(o)) i.others.push(o); }); }); });
  list.forEach(c=>{ const i=info[c.id]; if(i){ i.cross=i.others.some(o=>o.ownerUid!==c.ownerUid); i.self=i.others.some(o=>o.ownerUid===c.ownerUid); } });
  dupCache={src:list,info}; return info;
}
function findConflicts(draft, exceptId){
  const ks=dupKeys(draft); if(!ks.length) return [];
  return S.candidates.filter(c=>c.id!==exceptId && dupKeys(c).some(k=>ks.includes(k)));
}
const ownerOf = c => memberName(c.ownerUid) || c.member || "未割当";
function ownersLabel(list){ return [...new Set(list.map(c=>c.ownerUid===S.me?"自分":ownerOf(c)))].join("・"); }
function conflictDetail(hit){
  return hit.slice(0,5).map(h=>`<span class="dup-who"><b>${esc(ownerOf(h))}</b>${h.ownerUid===S.me?"（自分）":""}：${esc(nameOf(h)||"（名前未入力）")}${h.accountName?" "+esc(h.accountName):""}${[h.university,h.gradYear].filter(Boolean).length?"・"+esc([h.university,h.gradYear].filter(Boolean).join("・")):""}・${esc(progressOf(h))}</span>`).join("")+(hit.length>5?`<span class="dup-who">ほか${hit.length-5}件</span>`:"");
}

function applySort(list, sort){
  const s=sort||{}; const key=s.key||"registered"; const dir=s.key?s.dir:"asc"; const m=dir==="desc"?-1:1;
  const val = c => key==="name" ? (fullFuri(c)||fullName(c)||c.accountName||"") : key==="status" ? PROGRESS_OPTIONS.indexOf(progressOf(c)) : key==="registered" ? (c.createdAt||"") : (c[key]||"");
  return list.slice().sort((a,b)=>{ const x=val(a), y=val(b);
    if(key!=="registered" && key!=="status"){ if(!x && y) return 1; if(x && !y) return -1; }
    return (typeof x==="number" ? x-y : String(x).localeCompare(String(y),"ja"))*m; });
}
function sortBar(sort, opts, attr){
  const s=sort||{}; const curKey=s.key||"registered", curDir=s.key?s.dir:"asc";
  const b=(k,l)=>`<button type="button" ${attr}="${k}" class="${curKey===k?"active":""}">${l}${curKey===k?(curDir==="asc"?" ↑":" ↓"):""}</button>`;
  return `<div class="sortbar">並び替え ${b("registered","登録順")}${opts.map(([k,l])=>b(k,l)).join("")}</div>`;
}
const datalist = (id, arr) => `<datalist id="${id}">${arr.map(v=>`<option value="${esc(v)}"></option>`).join("")}</datalist>`;
function cell(id, field, value, type, cls, list){
  const ro = S.canWrite ? "" : " readonly";
  return `<input class="cell ${cls||""}" data-id="${id}" data-field="${field}" type="${type||"text"}"${list?` list="${list}"`:""} value="${esc(value)}"${ro}/>`;
}
const pill = st => st ? `<span class="pill s-${esc(st)}">${esc(st)}</span>` : `<span class="pill">—</span>`;
// IAA用：名前・ふりがなを横1行、大学などをその下に1行（はみ出す分は「…」）
function profileLine(c){
  const meta=[c.university,c.gradYear,c.club].filter(Boolean).join("・");
  return `<div class="pline"><div class="pl1"><span class="pn">${esc(fullName(c)||c.accountName||"（名前未入力）")}</span>${fullFuri(c)?`<span class="pf">${esc(fullFuri(c))}</span>`:""}</div>${meta?`<div class="pm" title="${esc(meta)}">${esc(meta)}</div>`:""}</div>`;
}
function progressLine(c, st){ return `<div class="prog">${pill(st)}<span class="pd">${md(latestActionDate(c))||"—"}</span></div>`; }
function profileCell(c){
  return `<div class="profile"><div class="n">${esc(fullName(c)||c.accountName||"（名前未入力）")}</div><div class="f">${esc(fullFuri(c))}</div><div class="m">${esc([c.university,c.gradYear,c.club].filter(Boolean).join("・"))}</div></div>`;
}

/* ================== データ保存 ================== */
const queues = {};
function enqueue(key, fn){ const p=(queues[key]||Promise.resolve()).then(fn); queues[key]=p.catch(()=>{}); return p; }
function errText(e){ return e && (e.code||e.message) ? `（${e.code||e.message}）` : ""; }
function writeFailed(e){
  if(e && e.code==="permission-denied"){ toast("権限がないため保存できませんでした。管理者に確認してください",6000); return; }
  toast("保存できませんでした"+errText(e), 6000);
}
function fieldPatch(cur, field, value){
  const w={};
  if(field==="name"){ [w.lastName,w.firstName]=splitName(value); }
  else if(field==="furigana"){ [w.lastNameFurigana,w.firstNameFurigana]=splitName(value); }
  else w[field]=value;
  if(field==="enrolled" && value) w.declined="";
  if(field==="declined" && value) w.enrolled="";
  if(field==="proposal" && value==="イベント" && !cur.proposalDate) w.proposalDate=todayStr();
  if(["interview1","initialActionDate","proposal"].includes(field) && cur.legacySourceStage) w.legacySourceStage="";
  if(cur.schedStatus && value && field===cur.schedFor){ w.schedStatus=""; w.schedDoneAt=todayStr(); }
  const after={...cur,...w}; w.stage=computeStage(after);
  const same=(a,b)=>Array.isArray(a)||Array.isArray(b) ? JSON.stringify(a||[])===JSON.stringify(b||[]) : (a??"")===(b??"");
  return Object.fromEntries(Object.entries(w).filter(([k,v])=>!same(cur[k],v)));
}
// リンク列：URL、またはInstagramは「@ユーザー名」でも開けるようにする
function linkHref(kind, v){
  v=String(v||"").trim(); if(!v) return "";
  if(/^https?:\/\//i.test(v)) return v;
  if(kind==="insta"){ const h=v.replace(/^[@＠]+/,"").replace(/^(https?:\/\/)?(www\.)?instagram\.com\//i,"").split(/[/?#\s]/)[0]; return /^[A-Za-z0-9._]+$/.test(h)?"https://www.instagram.com/"+h+"/":""; }
  if(/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v)) return "https://"+v;
  return "";
}
function linkCell(id, field, value, kind, ph){
  const href=linkHref(kind,value);
  return `<div class="lk"><input class="cell w-link" data-id="${id}" data-field="${field}" type="text" value="${esc(value)}" placeholder="${esc(ph||"URLを貼り付け")}"${S.canWrite?"":" readonly"}/>${href?`<a class="lk-go" href="${esc(href)}" target="_blank" rel="noopener" title="開く">↗</a>`:`<span class="lk-go off">↗</span>`}</div>`;
}
// 複数の項目をまとめて保存（日程調整の開始・解除など）
async function savePatch(id, patch){
  const cur=S.candidates.find(c=>c.id===id); if(!cur || !S.db) return;
  const p={...patch, updatedBy:S.me};
  const idx=S.candidates.findIndex(c=>c.id===id); S.candidates=S.candidates.slice(); S.candidates[idx]={...cur,...p}; if(S.absorbLocal) S.absorbLocal(id,{...cur,...p});
  render(true);
  try{ await enqueue("c/"+id, ()=>S.db.doc("candidates/"+id).update(p)); }catch(e){ writeFailed(e); }
}
const SCHED_TARGETS=[["interview1","面談1回目"],["interview2","面談2回目"],["interview3","面談3回目"],["proposalDate","④提案日"],["participationDate","⑤参加日"],["other","その他"]];
const schedLabel = k => (SCHED_TARGETS.find(t=>t[0]===k)||[,"その他"])[1];
function suggestSchedFor(c){
  if(!c.interview1) return "interview1";
  if(c.enrolled||c.declined) return "other";
  if(c.participationDate) return "other";
  if(c.proposalDate) return "participationDate";
  if(c.proposal) return "proposalDate";
  if(!c.interview2) return "interview2";
  if(!c.interview3) return "interview3";
  return "proposalDate";
}
function startSched(id, forKey, note){
  const c=S.candidates.find(x=>x.id===id); if(!c) return;
  savePatch(id,{schedStatus:"調整中", schedFor:forKey||suggestSchedFor(c), schedSince:todayStr(), schedNote:note||c.schedNote||""});
  toast(`${nameOf(c)}さんを日程調整中にしました`);
}
async function saveField(id, field, value){
  const cur=S.candidates.find(c=>c.id===id); if(!cur || !S.db) return;
  const patch=fieldPatch(cur, field, value);
  if(!Object.keys(patch).length) return;
  let warn="";
  if(field==="name" || field==="accountName"){
    const after={...cur,...patch};
    const hit=findConflicts(after, id).filter(h=>!findConflicts(cur,id).includes(h));
    if(hit.length) warn=`${ownersLabel(hit)}さんの登録と重複しています（保存しました）`;
  }
  patch.updatedAt=new Date().toISOString(); patch.updatedBy=S.me;
  const idx=S.candidates.findIndex(c=>c.id===id); S.candidates=S.candidates.slice(); S.candidates[idx]={...cur,...patch}; if(S.absorbLocal) S.absorbLocal(id,{...cur,...patch});
  try{ await enqueue("c/"+id, ()=>S.db.doc("candidates/"+id).update(patch)); if(warn) toast(warn,6000); }
  catch(e){ writeFailed(e); }
  // Tabで次の欄へ移る途中に描き直すとカーソルが消えるため、移動が終わってから描き直す
  setTimeout(()=>render(),0);

const LOGO = s => `<img src="${LOGO_SRC}" width="${s}" height="${s}" alt="株式会社Arxcs" style="display:block;width:${s}px;height:${s}px;object-fit:contain"/>`;
const APP_URL = location.origin + location.pathname;
// LINEで開いたとき、LINE内のブラウザではなく通常のブラウザ（Safari・Chrome）で開くようにする（openExternalBrowser=1）
const inviteLink = code => APP_URL + "?openExternalBrowser=1#invite-" + code;
// LINE・Instagram・Facebookなどのアプリ内ブラウザでは、GoogleがGoogleログインを拒否するため、通常のブラウザで開くよう案内する
const IN_APP = /Line\/|FBAN|FBAV|Instagram|Twitter|MicroMessenger|KAKAOTALK|Messenger|; wv\)/i.test(navigator.userAgent||"");
function gateCard(body){
  return `<div class="login-wrap"><div class="login-card" style="max-width:380px">
    <div class="logo-row">${LOGO(30)}<div><div class="logo-title brand-font">Arxcs</div><div class="logo-sub">個人シートアプリ・チーム共有</div></div></div>
    ${body}</div></div>`;
}
// ログイン前の画面：招待リンクからの登録／自動ログイン
function renderLogin(){
  if(S.dbState==="config") return gateCard(`<div class="banner">まだFirebaseの設定が入っていません（config.js）。</div>`);
  if(S.dbState==="signin" && IN_APP){
    const url=location.href.replace(/[?&]openExternalBrowser=1/,"");
    return gateCard(`<div style="font-weight:900;font-size:15px;margin-bottom:6px">ブラウザで開いてください</div>
      <p class="note" style="margin:0 0 10px">LINEやInstagramなどのアプリの中で開いているため、Googleでログインできません。画面の右上（または右下）のメニュー「…」から<b>「ブラウザで開く」</b>（「Safariで開く」「Chromeで開く」など）を選んでください。</p>
      <p class="note" style="margin:0 0 6px">うまくいかないときは、下のリンクをコピーして、SafariやChromeに貼り付けて開いてください。</p>
      <div style="display:flex;gap:6px"><input class="inp" readonly value="${esc(url)}" data-select-all style="font-size:11px"/><button class="btn sm" data-copy="${esc(url)}">コピー</button></div>`);
  }
  if(S.dbState==="signin") return gateCard(`<div style="font-weight:900;font-size:15px;margin-bottom:6px">${S.inviteCode?"チームに参加する":"ログイン"}</div>
    <p class="note" style="margin:0 0 14px">${S.inviteCode?"招待リンクから参加します。まずGoogleアカウントでログインしてください。":"Googleアカウントでログインしてください。一度ログインした端末では、次回から自動でログインします。"}</p>
    <button class="btn primary" id="googleBtn" style="padding:9px 18px;font-size:13px" ${S.signingIn?"disabled":""}>${S.signingIn?"ログイン中…":"Googleでログイン"}</button>
    ${S.authErr?`<div class="banner err" style="margin-top:12px">ログインできませんでした（${esc(S.authErr)}）。</div>`:""}`);
  if(S.dbState==="authfail") return gateCard(`<div class="banner err">ログインの準備に失敗しました（${esc(S.authErr||"")}）。通信状態を確認して、ページを開き直してください。</div>`);
  if(S.dbState!=="ready" || S.account===undefined || (S.account && S.members===null) || (S.isAdmin && S.members===null)) return gateCard(`<div class="note">読み込み中…</div>`);
  if(S.inviteCode && !S.account){
    if(S.invite===undefined) return gateCard(`<div class="note">招待を確認しています…</div>`);
    if(!S.invite) return gateCard(`<div class="banner err">この招待リンクは無効です。管理者に新しい招待リンクを依頼してください。</div>`);
    const forName=S.invite.memberName||"";
    return gateCard(`<div style="font-weight:900;font-size:15px;margin-bottom:4px">チームに参加する</div>
      <p class="note" style="margin:0 0 12px">${S.invite.memberId&&forName?`「${esc(forName)}」さんのシートで登録します。`:""}名前を確認して登録してください。次回からは、Googleでログインするだけで自分のシートが開きます。</p>
      <form id="regForm"><label class="lbl" for="regName">名前</label><input class="inp" id="regName" autocomplete="name" value="${esc(S.invite.memberId?forName:(S.displayName||""))}" placeholder="例：山田 太郎" required/>
      <label class="lbl" for="regEmail" style="margin-top:10px">メールアドレス（Googleアカウント）</label><input class="inp" id="regEmail" type="email" value="${esc(S.email||"")}" readonly style="background:#f5f5f5"/>
      <div style="margin-top:14px"><button class="btn primary" type="submit" ${S.regBusy?"disabled":""}>${S.regBusy?"登録中…":"登録してはじめる"}</button></div></form>`);
  }
  if(S.isAdmin){
    const ms=activeMembers();
    return gateCard(`<div style="font-weight:900;font-size:15px;margin-bottom:4px">管理者の初回設定</div>
      <p class="note" style="margin:0 0 12px">この端末を、どの担当者のシートにつなげるか選んでください。次回からは自動でログインします。${ms.length?"":"<br>（メンバーがまだいない場合は、先に「データ移行」で元のデータを取り込みます）"}</p>

async function apoStep(w, m, d){

function wordMatch(w, t){ if(t.includes(w)) return true; const n=w.length, r=Array(n+1).fill(false); r[0]=true;
  for(let e=2;e<=n;e++) for(let s=0;s<=e-2;s++){ if(r[s] && t.includes(w.slice(s,e))){ r[e]=true; break; } } return r[n]; }

/* ふりがな自動入力：氏名欄の「かな」のうちに打った部分を、ふりがな欄にそのまま映す */
const hira = s => (s||"").replace(/[ァ-ヶ]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
function kanaOrNull(s){ if(/^[ぁ-んー\s　]*$/.test(s||"")) return s; if(/^[ァ-ヶー\s　]*$/.test(s||"")) return hira(s); return null; }
function bindFurigana(nameEl, furiEl, onUpdate){
  if(!nameEl || !furiEl) return;
  let cName=nameEl.value||"", cFuri=furiEl.value||"", last=nameEl.value||"", manual=false, prog=false;
  furiEl.addEventListener("input",()=>{ if(!prog) manual=true; });
  const setF=v=>{ prog=true; furiEl.value=v; prog=false; onUpdate(v); };
  nameEl.addEventListener("input",()=>{
    const v=nameEl.value, prev=last; last=v;
    const whole=kanaOrNull(v);
    if(whole!==null){ const grew=v.startsWith(cName); cName=""; cFuri=""; if(!grew) manual=false; if(!manual) setF(whole); return; }
    if(prev.length && prev.startsWith(v) && v.length<prev.length){ cName=v; cFuri=""; manual=false; setF(""); return; }
    const grew=v.startsWith(cName), suf=grew?v.slice(cName.length):v, k=kanaOrNull(suf);
    if(k===null){ cName=v; if(grew) cFuri=furiEl.value; else { cFuri=""; manual=false; setF(""); } return; }
    if(!grew) manual=false; if(manual) return; setF((grew?cFuri:"")+k);
  });
}

const weekOfDay = d => Math.min(4, Math.floor((d-1)/7)+1);
function inPeriod(ds, p){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(ds||""); if(!m) return false; if(!p||!p.ym) return true; if(m[1]+"-"+m[2]!==p.ym) return false; return !p.week || weekOfDay(Number(m[3]))===p.week; }
function periodLabel(p){ if(!p.ym) return "全期間"; const [y,m]=p.ym.split("-"); return `${y}年${Number(m)}月`+(p.week?`${p.week}週目`:""); }
function stats(nums){ const v=nums.filter(n=>n!==null&&n>=0).sort((a,b)=>a-b); if(!v.length) return null; const mid=Math.floor(v.length/2);
  return {avg:Math.round(v.reduce((x,y)=>x+y,0)/v.length*10)/10, median:v.length%2?v[mid]:(v[mid-1]+v[mid])/2, min:v[0], max:v[v.length-1], n:v.length}; }
function renderDash(forWho, label){
  const now=new Date(), today=ymd(now), p=S.dashPeriod;
  const own=S.candidates.filter(c=>(forWho===null||c.ownerUid===forWho) && nameOf(c));
  const info=dupInfo(S.candidates);
  const gy=p.ym?Number(p.ym.slice(0,4)):now.getFullYear(), gm=p.ym?Number(p.ym.slice(5,7)):now.getMonth()+1;
  const goalDocs=forWho===null?Object.values(S.apoAll):[S.apoAll[forWho]];
  const grids=goalDocs.map(d=>gridOf(d,gy));
  const weekGoal=w=>grids.reduce((s,g)=>s+(Number(g[w][gm-1])||0),0);
  const monthGoal=["w1","w2","w3","w4"].reduce((s,w)=>s+weekGoal(w),0);
  const shownGoal=p.week?weekGoal("w"+p.week):monthGoal;
  const gp={ym:gy+"-"+String(gm).padStart(2,"0"),week:p.week};
  const actual=own.filter(c=>inPeriod(c.interview1,gp)).length;
  const pct=shownGoal>0?Math.min(100,Math.round(actual/shownGoal*100)):0;
  const gLabel=`${gy}年${gm}月`+(p.week?`${p.week}週目`:"");

  // 期間の選択肢
  const set=new Set(); for(let i=0;i<12;i++){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); set.add(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); }
  const curYm=today.slice(0,7);
  S.candidates.forEach(c=>[c.interview1,c.a2,c.dml,c.proposalDate,c.participationDate,c.enrolled,registeredDate(c)].forEach(d=>{ const m=/^(\d{4}-\d{2})/.exec(d||""); if(m&&m[1]<=curYm) set.add(m[1]); }));
  const months=[...set].sort().reverse();
  const periodBar=`<div class="dash-period"><label class="filter">期間<select id="dashMonth"><option value="">全期間</option>${months.map(ym=>{ const [y,m]=ym.split("-"); return `<option value="${ym}"${ym===p.ym?" selected":""}>${y}年${Number(m)}月</option>`; }).join("")}</select></label>
    <label class="filter">週<select id="dashWeek"${p.ym?"":" disabled"}><option value="">月全体</option>${[[1,7],[8,14],[15,21],[22,31]].map(([a,b],i)=>`<option value="${i+1}"${p.week===i+1?" selected":""}>${i+1}週目（${a}〜${i===3?"月末":b+"日"}）</option>`).join("")}</select></label>
    <span class="note">${p.ym?"リードタイム・移行率・段階ごとの人数は、この期間の分だけで数えます":"月を選ぶと、その月（さらに週）の数字だけで見られます"}</span></div>`;

  // アラート
  const gap=own.filter(c=>c.interview1&&!c.enrolled&&!c.declined).map(c=>{ const st=computeStatus(c), last=latestActionDate(c), el=diffDays(last,today), lim=alertDaysFor(st); return {c,st,last,el,lim}; })
    .filter(x=>x.el!==null&&x.el>x.lim).sort((a,b)=>(b.el-b.lim)-(a.el-a.lim))
    .map(x=>({id:x.c.id,name:nameOf(x.c),reason:`「${x.st}」から${x.el}日経過（${md(x.last)}・目安${x.lim}日を超過）`,sev:"warn"}));
  const contact=own.filter(c=>computeStage(c)==="lead"&&!c.interview1&&isDate(c.contactedAt)).map(c=>({c,el:diffDays(c.contactedAt,today)})).filter(x=>x.el!==null&&x.el>alertContact()).sort((a,b)=>b.el-a.el)
    .map(x=>({id:x.c.id,name:nameOf(x.c),reason:`接触（${md(x.c.contactedAt)}）から${x.el}日、面談の日付が未設定（目安${alertContact()}日を超過）`,sev:"warn",tab:"lead"}));
  const dupA=own.filter(c=>info[c.id]).map(c=>{ const d=info[c.id]; const who=d.cross?[...new Set(d.others.filter(o=>o.ownerUid!==c.ownerUid).map(ownerOf))].join("・")+"さんと重複":"同じ担当者の一覧内で重複"; return {id:c.id,name:nameOf(c),reason:who,sev:"dup",tab:"lead"}; });
  const items=[...dupA,...gap,...contact,
    ...own.filter(c=>computeStage(c)==="interview"&&!c.a2&&!c.dml).map(c=>({id:c.id,name:nameOf(c),reason:"①A2・②DMLがまだ未着手です",sev:"info"})),
    ...own.filter(c=>c.schedStatus).map(c=>{ const d=diffDays(c.schedSince,today); return {id:c.id,name:nameOf(c),reason:`日程調整中（${schedLabel(c.schedFor)}・${d==null?"—":d+"日経過"}）`,sev:d>7?"warn":"info",tab:"sched"}; }),
    ...own.filter(c=>computeStage(c)==="lead"&&!c.interview1&&!c.schedStatus).map(c=>({id:c.id,name:nameOf(c),reason:"IAA（面談1回目）の日付が未設定です",sev:"info",tab:"lead"}))].slice(0,20);
  const clickable = forWho===S.me;
  const alertHtml=items.length?items.map(a=>`<div class="arow ${a.sev}"${clickable?` data-goto="${a.id}"${a.tab?` data-goto-tab="${a.tab}"`:""} tabindex="0"`:""}><span class="n">${esc(a.name)}</span><span class="r">${a.sev==="dup"?"重複：":a.sev==="warn"?"⚠ ":""}${esc(a.reason)}</span><span class="go">${clickable?"›":""}</span></div>`).join(""):`<div class="dempty">対応漏れの候補者はいません。順調です。</div>`;

  // ネクストアクション
  const up=[]; own.forEach(c=>STEPS.filter(s=>!s.text).forEach(s=>{ if(c[s.field]&&c[s.field]>=today) up.push({id:c.id,name:nameOf(c),date:c[s.field],label:s.label,field:s.field,meta:[c.university,c.gradYear].filter(Boolean).join("・")}); }));
  up.sort((a,b)=>a.date.localeCompare(b.date));
  const nx=own.filter(c=>isIaa(c)&&!c.enrolled&&!c.declined).map(c=>{ const f=nextMainField(c), last=latestActionDate(c); return f?{id:c.id,name:nameOf(c),field:f,label:STEP_BY[f].label,last,el:diffDays(last,today),meta:[c.university,c.gradYear].filter(Boolean).join("・")}:null; }).filter(Boolean).sort((a,b)=>(b.el??-1)-(a.el??-1));
  const MAX=forWho===null?30:Infinity;
  const g=id=>clickable?` data-goto="${id}" tabindex="0"`:"";
  const naHtml=(up.length||nx.length)?`<div class="na-list">${up.slice(0,MAX).map(it=>`<div class="na-row"${g(it.id)}><span class="na-when${it.date===today?" today":""}">${it.date===today?"今日":"予定 "+md(it.date)}</span><span class="na-name">${esc(it.name)}</span><span class="na-chip" style="--c:var(--s-${it.field})">${esc(it.label)}</span><span class="na-meta">${esc(it.meta)}</span><span class="go">›</span></div>`).join("")}
    ${nx.slice(0,MAX).map(it=>`<div class="na-row"${g(it.id)}><span class="na-when${it.el>14?" late":""}">${it.el===null?"—":it.el+"日経過"}</span><span class="na-name">${esc(it.name)}</span><span class="na-chip" style="--c:var(--s-${it.field})">次：${esc(it.label)}</span><span class="na-meta">${it.last?"最終 "+md(it.last)+"・":""}${esc(it.meta)}</span><span class="go">›</span></div>`).join("")}</div>`:`<div class="dempty">IAA中の人はいません。</div>`;

  // ファネル
  const funnel=p.ym?[["見込み",own.filter(c=>inPeriod(registeredDate(c),p)).length],["IAA（面談）",own.filter(c=>inPeriod(c.interview1,p)).length],["①A2基準達成",own.filter(c=>inPeriod(c.a2,p)).length],["③提案",own.filter(c=>inPeriod(c.proposalDate,p)).length],["⑤参加",own.filter(c=>inPeriod(c.participationDate,p)).length],["⑥入会",own.filter(c=>inPeriod(c.enrolled,p)).length]]
    :[["見込み",own.length],["IAA（面談）",own.filter(c=>c.interview1).length],["①A2基準達成",own.filter(c=>c.a2).length],["③提案",own.filter(c=>c.proposal||c.proposalDate).length],["⑤参加",own.filter(c=>c.participationDate).length],["⑥入会",own.filter(c=>c.enrolled).length]];
  const fmax=Math.max(1,funnel[0][1]);
  const funnelHtml=funnel.map(([l,n],i)=>`<div class="funnel-row"><span>${l}</span><div class="funnel-track"><div class="funnel-bar" style="width:${Math.max(n?4:0,Math.round(n/fmax*100))}%;opacity:${1-i*.1}"></div></div><span class="funnel-num">${n}</span></div>`).join("");

  // 移行率
  const iaa=c=>!!c.interview1, a2=c=>!!c.a2, prop=c=>!!(c.proposal||c.proposalDate), part=c=>!!c.participationDate, enr=c=>!!c.enrolled;
  const steps=[["IAA化",()=>true,iaa,registeredDate],["①A2達成",iaa,a2,c=>c.interview1],["③提案",a2,prop,c=>c.a2],["⑤参加",prop,part,c=>c.proposalDate],["⑥入会",part,enr,c=>c.participationDate]];
  const conv=steps.map(([l,from,to,fd])=>{ const b=own.filter(from).filter(c=>!p.ym||inPeriod(fd(c),p)); const t=b.filter(to).length; return [l,b.length?Math.round(t/b.length*100):null,t,b.length]; });
  const convHtml=`<div class="conv-row">${conv.map(([l,pc,t,f])=>`<div class="conv-item"><div class="conv-pct">${pc===null?"—":pc+"<small>%</small>"}</div><div class="conv-label">${l}</div><div class="conv-n">${t}/${f}人</div></div>`).join('<span class="conv-arrow">›</span>')}</div>`;

  // 滞留
  const active=own.filter(c=>c.interview1&&!c.enrolled&&!c.declined);
  const sd=stats(active.map(c=>diffDays(latestActionDate(c),today)));
  const overdue=active.filter(c=>{ const d=diffDays(latestActionDate(c),today); return d!==null&&d>alertDaysFor(computeStatus(c)); }).length;
  const d1=v=>v===null||v===undefined?"—":`${v}<small>日</small>`;
  const stgHtml=`<div class="stg-row"><div class="stg-item"><span>進行中</span><b>${active.length}<small>人</small></b></div><div class="stg-item"><span>最終アクションからの平均</span><b>${sd?d1(sd.avg):"—"}</b></div><div class="stg-item${overdue?" warn":""}"><span>目安日数を超えて止まっている</span><b>${overdue}<small>人</small></b></div></div>`;

  // リードタイム
  const pairs=[["見込み登録 → 面談1回目",c=>diffDays(registeredDate(c),c.interview1),c=>c.interview1],["面談1回目 → ①A2基準達成",c=>diffDays(c.interview1,c.a2),c=>c.a2],["①A2 → ②DML動画配布",c=>diffDays(c.a2,c.dml),c=>c.dml],["②DML → ④提案日",c=>diffDays(c.dml,c.proposalDate),c=>c.proposalDate],["④提案日 → ⑤参加日",c=>diffDays(c.proposalDate,c.participationDate),c=>c.participationDate],["⑤参加日 → ⑥入会",c=>diffDays(c.participationDate,c.enrolled),c=>c.enrolled],["面談1回目 → ⑥入会（合計）",c=>diffDays(c.interview1,c.enrolled),c=>c.enrolled]];
  const ltHtml=`<table class="lt"><tr><th>区間</th><th>平均</th><th>中央値</th><th>最短</th><th>最長</th><th>人数</th></tr>${pairs.map(([l,fn,end])=>{ const r=stats((p.ym?own.filter(c=>inPeriod(end(c),p)):own).map(fn));
    return `<tr><td class="l">${l}</td>${r?`<td class="main">${d1(r.avg)}</td><td>${d1(r.median)}</td><td>${d1(r.min)}</td><td>${d1(r.max)}</td><td>${r.n}人</td>`:`<td class="none" colspan="5">まだデータがありません</td>`}</tr>`; }).join("")}</table>`;

  const goalHtml=`<div class="goal-wrap"><div class="ring" style="--pct:${pct}"><span>${pct}<small>%</small></span></div><div><div style="font-size:13px">実績 <b>${actual}</b> / 目標 <b>${shownGoal}</b></div>
    <div class="note">${shownGoal===0?`「アポ目標」でこの${p.week?"週":"月"}の目標を設定すると、ここに達成率が表示されます。`:`実績＝見込み顧客の「IAA」の日付が${gLabel}の人数`}</div></div></div>
    <div class="dsub">週ごとの目標（${gm}月）</div><div class="mini-list">${["w1","w2","w3","w4"].map((w,i)=>`<div class="mini-row${p.week===i+1?" current":""}"><span>${i+1}週目</span><b>${weekGoal(w)}<small>件</small></b></div>`).join("")}</div>`;
  const ym=today.slice(0,7), inMonth=f=>own.filter(c=>(c[f]||"").slice(0,7)===ym).length;
  const monthHtml=`<div class="dsub">今月の動き</div><div class="mini-list">${[["IAA（面談1回目）","interview1"],["①A2基準達成","a2"],["④提案","proposalDate"],["⑤参加","participationDate"],["⑥入会","enrolled"]].map(([l,f])=>`<div class="mini-row"><span><i class="mini-dot" style="--c:var(--s-${f})"></i>${l}</span><b>${inMonth(f)}<small>件</small></b></div>`).join("")}</div>`;
  const dupCount=own.filter(c=>info[c.id]).length, evCount=own.filter(isEventC).length, decl=own.filter(c=>c.declined).length;
  return `<div class="dash">${periodBar}<div class="dash-top">
    <section class="dcard"><h3>${p.ym?"アポ目標":"今月のアポ目標"}（${gLabel}）</h3>${goalHtml}</section>
    <section class="dcard"><h3>リードタイム（${esc(label||"自分の数字")}${p.ym?"・"+periodLabel(p):""}）</h3><div class="dsub first">段階ごとの移行率</div>${convHtml}<div class="dsub">滞留状況</div>${stgHtml}<div class="dsub">区間ごとの日数</div>${ltHtml}</section>
    <section class="dcard"><h3>${p.ym?`段階ごとの人数（${periodLabel(p)}）`:"段階ごとの人数"}</h3>${funnelHtml}${p.ym?"":monthHtml}</section></div>
    <div class="dash-bottom"><section class="dcard"><h3>ネクストアクション <span class="count">${up.length+nx.length}件</span></h3>${naHtml}</section>
    <section class="dcard"><h3>経過日数・重複アラート</h3><div class="dash-stats"><div class="dstat"><div class="l">重複検知</div><div class="v" style="${dupCount?"color:var(--danger)":""}">${dupCount}</div></div><div class="dstat"><div class="l">イベント参加</div><div class="v">${evCount}</div></div><div class="dstat"><div class="l">⑦見送り</div><div class="v" style="${decl?"color:var(--danger)":""}">${decl}</div></div></div><div class="alist">${alertHtml}</div></section></div></div>`;
}

function renderAdmin(){

  const subs=[["dash","全体ダッシュボード"],["members","メンバー"],["masters","マスタ"],["alert","アラート日数"],["invite","招待・アカウント"],["import","データ移行"]];

/* ================== データ移行（元アプリから書き出したファイルを取り込む） ================== */
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function renderImport(){
  const f=S.importFile, st=S.importState;
  return `<div class="import-box"><h3 style="margin:0 0 8px;font-size:14px">元アプリのデータを取り込む</h3>
    <p class="note">元アプリから書き出した移行ファイル（arxcs-migration.json）を選んでください。同じファイルを何度取り込んでも、同じ人が二重に登録されることはありません（元アプリのIDで上書きします）。</p>
    <input type="file" id="importFile" accept=".json,application/json" ${st&&st.running?"disabled":""}/>
    <div class="note" style="margin:10px 0 4px">または、移行データをここに貼り付け：</div>
    <textarea class="inp" id="importPaste" style="min-height:70px" placeholder="移行データ（{&quot;format&quot;:&quot;arxcs-migration-v1&quot; …}）を貼り付け" ${st&&st.running?"disabled":""}></textarea>
    ${f?`<div class="mini-list" style="margin-top:12px"><div class="mini-row"><span>見込み顧客</span><b>${f.candidates.length}件</b></div><div class="mini-row"><span>メンバー（過去の担当者を含む）</span><b>${f.members.length}名</b></div><div class="mini-row"><span>アポ目標</span><b>${Object.keys(f.apoGoals||{}).length}名分</b></div><div class="mini-row"><span>マスタ（大学など）</span><b>${f.masters?"あり":"なし"}</b></div></div>
      <div style="margin-top:12px"><button class="btn primary" id="runImport" ${st&&st.running?"disabled":""}>取り込む</button></div>`:""}
    <div id="importProgress">${importProgressHtml()}</div></div>`;
}
function importProgressHtml(){
  const st=S.importState; if(!st) return "";
  const pct=st.total?Math.round(st.done/st.total*100):0;
  return `<div class="progress"><div style="width:${pct}%"></div></div><div class="note">${st.running?"取り込み中です。この画面を閉じずにお待ちください。":"取り込みが終わりました。"} ${st.done} / ${st.total}${st.failed?`（失敗 ${st.failed}件。もう一度「取り込む」を押すと続きを入れ直します）`:""}</div>`;
}
function updateImportUI(){ const el=document.getElementById("importProgress"); if(el) el.innerHTML=importProgressHtml(); }
async function runImport(){
  if(!S.isAdmin) return;
  const f=S.importFile; if(!f || (S.importState&&S.importState.running)) return;
  const ops=[];
  if(f.masters) ops.push(["settings/masters", {...DEFAULT_MASTERS, ...f.masters, alert:{...DEFAULT_MASTERS.alert, ...((S.masters||{}).alert||{}), ...(f.masters.alert||{})}}]);
  f.members.forEach(m=>ops.push(["members/"+m.id, {name:m.name, active:m.active!==false, order:m.order??999}]));
  Object.entries(f.apoGoals||{}).forEach(([id,d])=>ops.push(["apoGoals/"+id, d]));
  f.candidates.forEach(c=>{ const {id,...rest}=c; ops.push(["candidates/"+id, rest]); });
  S.importing=true; S.importState={total:ops.length, done:0, failed:0, running:true}; render(true);
  let i=0, failed=0;
  const worker=async()=>{ while(i<ops.length){ const [p,d]=ops[i++]; let tries=0;
    for(;;){ try{ await S.db.doc(p).set(d); break; }
      catch(e){ if((["resource-exhausted","unavailable","deadline-exceeded","aborted"].includes(e.code)) && tries<8){ tries++; await sleep(400*Math.pow(2,Math.min(tries,5))); continue; } failed++; console.error("取り込み失敗",p,e); break; } }
    S.importState.done++; S.importState.failed=failed; if(S.importState.done%10===0 || S.importState.done===ops.length) updateImportUI(); } };
  await Promise.all([worker(),worker(),worker(),worker()]);
  S.importState.running=false; S.importing=false; render(true);
  toast(failed?`取り込みが終わりました（失敗 ${failed}件）`:`${f.candidates.length}件の取り込みが終わりました`, 6000);
}

function renderBody(){

    case "admin": return S.isAdmin ? renderAdmin() : `<div class="banner err">この画面は管理者だけが使えます。</div>`;
  }
  return "";
}
function captureFocus(){
  const a=document.activeElement; if(!a || a===document.body || !document.getElementById("app").contains(a)) return null;
  const attrs=["data-id","data-field","data-draft","id","data-na-input","data-ov-q","data-mem-name","data-master","data-alert","data-qbox"];
  const sel=attrs.filter(k=>a.hasAttribute(k)).map(k=>`[${k}="${CSS.escape(a.getAttribute(k))}"]`).join("");
  if(!sel) return null;
  let s=null,e=null; try{ s=a.selectionStart; e=a.selectionEnd; }catch(x){}
  const row=a.closest("[data-search]"); return {sel, s, e, inCard: !!(row && row.classList.contains("lcard"))};
}
function render(force){
  const app=document.getElementById("app");
  // 入力中に他の人の更新が届いても、打っている途中の欄が作り直されないよう、描画をフォーカスが外れるまで待つ
  if(S.importing && !force) return;
  if(!force && (pointerIsDown || isTypingDirty())){ S.deferRender=true; return; }
  S.deferRender=false;
  if(!S.me && S.account && S.account.memberId) S.me=S.account.memberId;
  if(!S.me || (S.me!=="__admin__" && !(S.members||[]).some(m=>m.id===S.me))){
    app.innerHTML=renderLogin(); bindLogin(); return;
  }
  const scrolls=[...app.querySelectorAll(".scrollx")].map(el=>[el.scrollLeft,el.scrollTop]);
  const wy=window.scrollY, focus=captureFocus();
  if(S.tab==="admin" && !S.isAdmin) S.tab="dash";
  app.innerHTML=renderTop()+`<div class="app-content">`+

    (S.stale?`<div class="banner">データの最新状態を確認できていません。通信状態をご確認ください。</div>`:"")+

    renderBody()+`</div><div class="watermark">Arxcs</div>`;
  bindApp();
  if(S.lastTab===S.tab){ app.querySelectorAll(".scrollx").forEach((el,i)=>{ if(scrolls[i]){ el.scrollLeft=scrolls[i][0]; el.scrollTop=scrolls[i][1]; } }); window.scrollTo(0,wy); }
  else window.scrollTo(0,0);
  S.lastTab=S.tab;
  if(focus){ const el=app.querySelector(focus.sel); if(el){ el.focus({preventScroll:true}); try{ if(focus.s!=null) el.setSelectionRange(focus.s,focus.e); }catch(x){} } }
  if(S.focusRow){ const r=app.querySelector(`[data-row="${S.focusRow}"]`); if(r){ r.scrollIntoView({block:"center"}); r.style.outline="2px solid var(--brand)"; } S.focusRow=null; }
}
// 入力中（打ちかけで未確定）の欄があるか。あれば、他の人の更新が届いても描画を待つ
function isTypingDirty(){
  const a=document.activeElement, app=document.getElementById("app");
  if(!a || !app.contains(a) || !/^(INPUT|TEXTAREA)$/.test(a.tagName)) return false;
  if(a.type==="checkbox") return false;
  return a.value!==a.defaultValue || a.hasAttribute("data-draft") || a.id==="leadSearch";
}
let pointerIsDown=false;
document.addEventListener("pointerdown",()=>{ pointerIsDown=true; },true);
document.addEventListener("pointerup",()=>{ setTimeout(()=>{ pointerIsDown=false; if(S.deferRender) render(); },30); },true);
document.addEventListener("focusout",()=>{ setTimeout(()=>{ if(S.deferRender) render(); },0); });
let toastTimer=null;
function toast(msg, ms){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent=msg; t.style.display="";
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.style.display="none"; },ms||2500);
}

function toggleSort(cur, key){ const c=cur||{}; const ck=c.key||"registered", cd=c.key?c.dir:"asc"; return {key, dir: ck===key&&cd==="asc"?"desc":"asc"}; }

/* ================== 起動：Firebase ================== */
// Firestoreを、管理画面のコードと同じ形（doc/collection/set/update/onSnapshot）で使うための薄いラッパー。
// 書き込むたびに updatedAt にサーバー時刻を入れる（見込み顧客の「変更分だけ読む」同期に使う）。
function makeDb(fs){
  const wrap = d => ({ id:d.id, exists:d.exists(), data:()=>d.exists()?d.data({serverTimestamps:"estimate"}):undefined, metadata:d.metadata });
  const stamp = d => ({ ...d, updatedAt: serverTimestamp() });
  const docRef = p => { const r=fdoc(fs,p); return {
    id:r.id, path:p,
    get: async()=>wrap(await getDoc(r)),
    set: d=>setDoc(r, stamp(d)),
    update: d=>updateDoc(r, stamp(d)),
    delete: ()=>deleteDoc(r),
    onSnapshot: (n,e)=>fsnap(r, s=>n(wrap(s)), e)
  }; };
  const colRef = p => ({
    path:p,
    doc: id => id ? docRef(p+"/"+id) : docRef(fdoc(fcol(fs,p)).path),
    add: async d => { const r=await addDoc(fcol(fs,p), stamp(d)); return docRef(r.path); },
    onSnapshot: (n,e)=>fsnap(fcol(fs,p), s=>n({docs:s.docs.map(wrap), metadata:s.metadata}), e)
  });
  return { doc:docRef, collection:colRef, fs };
}
async function googleSignIn(){
  const provider=new GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
  S.signingIn=true; S.authErr=null; render(true);
  try{ await signInWithPopup(S.auth, provider); }
  catch(e){
    if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)){ try{ await signInWithRedirect(S.auth, provider); return; }catch(e2){ S.authErr=e2.code; } }
    else if(e.code!=="auth/popup-closed-by-user") S.authErr=e.code;
  }
  S.signingIn=false; render(true);
}
async function doSignOut(){ try{ await signOut(S.auth); }catch(e){} try{ sessionStorage.removeItem("arxcs_invite"); }catch(e){} location.replace(location.pathname); }
let dataStarted=false;
// メンバー（または管理者）になってから、チームのデータを読み始める
function startData(){
  if(dataStarted) return; dataStarted=true;
  const db=S.db, fs=db.fs;
  const fail=e=>{ console.error(e); if(e && e.code==="permission-denied") return; toast("データの取得に失敗しました"+errText(e),6000); };
  db.collection("members").onSnapshot(snap=>{ S.members=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0)); render(); }, e=>{ S.members=[]; fail(e); render(); });
  db.collection("apoGoals").onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{ o[d.id]=d.data(); }); S.apoAll=o; render(); }, fail);
  db.doc("settings/masters").onSnapshot(snap=>{ const d=snap.exists?snap.data():null;
    S.masters=d?{...DEFAULT_MASTERS,...d,universities:Array.isArray(d.universities)?d.universities.map(u=>typeof u==="string"?{name:u,region:"未設定"}:u):[],alert:{...DEFAULT_MASTERS.alert,...(d.alert||{})}}:null; render(); }, fail);
  // 見込み顧客：前回この端末に保存した分をすぐ表示し、サーバーからは「前回以降に変わった分」だけを読む（無料枠の読み込み回数を節約）
  (async()=>{
    const col=fcol(fs,"candidates"); const cmap=new Map(); let maxMs=0;
    const absorb=(id,data)=>{ cmap.set(id,{...data,id}); const t=data.updatedAt&&data.updatedAt.toMillis?data.updatedAt.toMillis():0; if(t>maxMs) maxMs=t; };
    const publish=()=>{ S.candidates=[...cmap.values()].filter(c=>!c.deleted); render(); };
    S.absorbLocal=(id,data)=>{ const {updatedAt,...rest}=data; const prev=cmap.get(id)||{}; cmap.set(id,{...prev,...rest,id}); };
    try{ const cs=await getDocsFromCache(col); cs.forEach(d=>absorb(d.id,d.data({serverTimestamps:"estimate"}))); if(cs.size) publish(); }catch(e){}
    const since=Timestamp.fromMillis(Math.max(0,maxMs-2*60*1000));
    fsnap(query(col, where("updatedAt",">",since)), snap=>{
      snap.docChanges().forEach(ch=>{ if(ch.type!=="removed") absorb(ch.doc.id, ch.doc.data({serverTimestamps:"estimate"})); });
      S.stale=false; publish();
    }, fail);
  })();
  // 管理者にする担当者の一覧（settings/roles）
  db.doc("settings/roles").onSnapshot(snap=>{
    S.roles = snap.exists ? (snap.data().adminMembers||[]) : null;
    if(S.roles===null && S.passwordAdmin){ db.doc("settings/roles").set({adminMembers:DEFAULT_ADMIN_MEMBERS}).catch(()=>{}); }
    updateAdmin(); render();
  }, e=>{ S.roles=null; updateAdmin(); render(); });
  if(S.isAdmin) startAdminData();
}
let adminStarted=false;
function startAdminData(){
  if(adminStarted) return; adminStarted=true;
  const db=S.db, fail=e=>console.error(e);
  db.collection("accounts").onSnapshot(snap=>{ S.accounts=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, fail);
  db.collection("invites").onSnapshot(snap=>{ S.invites=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||"")); render(); }, fail);
}
// 管理者かどうか：管理者パスワードで登録した人、または「管理者にする担当者」に入っている担当者のシートでログインしている人
function updateAdmin(){
  const roleAdmin = !!(S.account && Array.isArray(S.roles) && S.roles.includes(S.account.memberId));
  S.isAdmin = !!(S.passwordAdmin || roleAdmin);
  if(S.isAdmin && dataStarted) startAdminData();
}
(async function start(){
  render(true);
  if(!firebaseConfig || !firebaseConfig.apiKey){ S.dbState="config"; render(true); return; }
  const app=initializeApp(firebaseConfig);
  const auth=getAuth(app);
  let fs;
  try{ fs=initializeFirestore(app,{ localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
  catch(e){ fs=initializeFirestore(app,{}); }
  S.db=makeDb(fs);
  S.auth=auth;
  const hm0=/^#invite-([a-z0-9]{6,40})$/.exec(location.hash||""); if(hm0){ S.inviteCode=hm0[1]; try{ sessionStorage.setItem("arxcs_invite",hm0[1]); }catch(e){} }
  else { try{ const v=sessionStorage.getItem("arxcs_invite"); if(v) S.inviteCode=v; }catch(e){} }
  try{ await getRedirectResult(auth); }catch(e){ S.authErr=e.code; }
  // Googleログイン：一度ログインするとブラウザに保存され、次回から自動でログインする
  const user = await new Promise(resolve=>{
    const un=onAuthStateChanged(auth, u=>{ if(u){ un(); resolve(u); } else { S.dbState="signin"; render(true); } });
  });
  S.uid=user.uid; S.email=user.email||""; S.displayName=user.displayName||""; S.dbState="loading"; render(true);
  try{ const a=await S.db.doc("admins/"+S.uid).get(); S.passwordAdmin=a.exists; }catch(e){ S.passwordAdmin=false; }
  updateAdmin();
  S.db.doc("accounts/"+S.uid).onSnapshot(snap=>{
    S.account=snap.exists?snap.data():null;
    if(S.account){ if(!S.actingAs) S.me=S.account.memberId; S.inviteCode=null; try{ sessionStorage.removeItem("arxcs_invite"); }catch(e){} startData(); }
    else if(!S.actingAs) S.me=null;
    updateAdmin();
    if(S.isAdmin) startData();
    S.dbState="ready"; render();
  }, e=>{ S.account=null; S.dbState="ready"; render(); });
  if(S.inviteCode) S.db.doc("invites/"+S.inviteCode).get().then(sn=>{ S.invite=sn.exists?sn.data():null; render(true); }).catch(()=>{ S.invite=null; render(true); });
  window.addEventListener("hashchange",()=>{ const m=/^#invite-([a-z0-9]{6,40})$/.exec(location.hash||""); if(m && !S.account){ S.inviteCode=m[1]; S.invite=undefined; render(true); S.db.doc("invites/"+m[1]).get().then(sn=>{ S.invite=sn.exists?sn.data():null; render(true); }).catch(()=>{ S.invite=null; render(true); }); } });
})();
